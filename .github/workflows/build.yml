name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Chiave per le notifiche al partner (facoltativa)
        env:
          FCM_SA_B64: ${{ secrets.FCM_SA_B64 }}
        run: |
          if [ -n "$FCM_SA_B64" ]; then
            echo "$FCM_SA_B64" | base64 -d > assets/fcm_sa.json
            echo "Chiave push presente"
          else
            echo "Nessuna chiave push: abbracci e avvisi al partner disattivati"
          fi

      - name: Genera progetto Android e dipendenze
        run: bash scripts/bootstrap.sh

      - name: Configurazione Firebase
        run: cp google-services.json android/app/google-services.json

      - name: Firma (keystore fisso)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ukeep.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=ukeep"
            echo "storeFile=$RUNNER_TEMP/ukeep.jks"
          } > android/key.properties
          python3 scripts/patch_gradle.py
          python3 scripts/patch_google_services.py

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Pubblica APK nelle Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
